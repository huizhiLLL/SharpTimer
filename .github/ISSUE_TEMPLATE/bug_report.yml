name: Bug 反馈
description: 反馈可复现的问题、崩溃、异常行为或智能魔方连接问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量提供可复现信息，尤其是 App 版本、Windows 版本、智能魔方型号和操作步骤。

  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 说明遇到的问题，以及原本的预期
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 如果方便，请完整的描述复现步骤
      placeholder: |
        1. 打开 ...
        2. 连接 ...
        3. 开始打乱/计时 ...
        4. 出现 ...

  - type: input
    id: cube
    attributes:
      label: 智能魔方型号
      description: 如果问题和智能魔方或蓝牙连接有关，请填写具体型号
      placeholder: 例如：V10ai、GAN 12ui、QYSC

  - type: input
    id: app-version
    attributes:
      label: App 版本
      placeholder: 例如：1.0.2.0

  - type: input
    id: windows-version
    attributes:
      label: Windows 版本与设备
      placeholder: 例如：Windows 11 24H2 / Surface Pro 9
